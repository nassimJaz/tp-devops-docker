name: Test backend
on:
  #to begin you want to launch this job in main and develop
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
     #checkout your github code using actions/checkout@v4
      - uses: actions/checkout@v4

     #do the same with another action (actions/setup-java@v4) that enable to setup jdk 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"

     #finally build your app with the latest command
      - name: Build and test with Maven
        run: mvn -B verify sonar:sonar -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY}} -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=${{ secrets.SONAR_TOKEN }}  --file ./simple-api/pom.xml

  # si les tests passent sur develop, on ouvre une PR vers main
  create-pull-request:
    needs: test-backend
    if: ${{ github.ref == 'refs/heads/develop' }}

    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write

    steps:
      - name: Create pull request develop -> main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # on ne crée pas de PR si il y en a déjà une ouverte
          if [ -z "$(gh pr list --repo ${{ github.repository }} --head develop --base main --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo ${{ github.repository }} --head develop --base main --title "Merge develop into main" --body "PR créée automatiquement après la validation des tests."
          fi
